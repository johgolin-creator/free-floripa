<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="PONT conecta freelancers e empresas para turnos, diárias e eventos em Florianópolis."
    />
    <title>PONT | Conecta. Oportunidades. Talentos.</title>
    <meta name="theme-color" content="#111318" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- App web instalável (Android via manifesto, iPhone via "Adicionar à Tela de Início") -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default" deixa a barra de status opaca e o conteúdo começa abaixo dela.
         Com "black-translucent" o app instalado desenhava sob o relógio/bateria
         e o cabeçalho ficava cortado. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PONT" />

    <!-- Prévia de link (WhatsApp, Instagram, redes sociais) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PONT" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://usepont.com.br/" />
    <meta property="og:title" content="PONT | Conecta. Oportunidades. Talentos." />
    <meta
      property="og:description"
      content="PONT conecta freelancers e empresas para turnos, diárias e eventos em Florianópolis."
    />
    <meta property="og:image" content="https://usepont.com.br/og.jpg" />
    <meta property="og:image:width" content="1366" />
    <meta property="og:image:height" content="599" />
    <meta property="og:image:alt" content="PONT — plataforma para turnos, diárias e eventos" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PONT | Conecta. Oportunidades. Talentos." />
    <meta
      name="twitter:description"
      content="PONT conecta freelancers e empresas para turnos, diárias e eventos em Florianópolis."
    />
    <meta name="twitter:image" content="https://usepont.com.br/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Carrega a fonte sem bloquear a primeira renderização. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
