services:
  - type: web
    name: pont
    runtime: static
    buildCommand: pnpm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_STATE_KEY
        sync: false
      - key: VITE_PUBLIC_APP_URL
        value: https://usepont.com.br
      - key: VITE_SUPPORT_WHATSAPP
        value: "5548998556221"
      - key: VITE_PHONE_VERIFICATION
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_UMAMI_SRC
        sync: false
      - key: VITE_UMAMI_WEBSITE_ID
        sync: false
      - key: VITE_PAYMENTS_ENABLED
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        value: BLHp6knaOHBqC1SkNlgMhvlER1_0Wl5G0E5txbj6P73FV52tUn7rsOTB2CKe3rQ_WLkcuWMms7j6EPusFyIgpq4
